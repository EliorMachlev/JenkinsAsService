name: Build WiX Burn bundle
description: >-
  Builds the single self-selecting installer .exe that embeds all three MSIs. Exists for the same reason as
  the publish and build-msi actions: build.yml and release.yml must package identically, and the only way to
  guarantee that is for both to call one definition. It deliberately does NOT build the MSIs - it takes the
  three that were just produced, so a bundle can never embed a stale package it happened to find on disk.

inputs:
  x64-msi:
    description: Path to the x64 MSI to embed, relative to the bundle project.
    required: true
  x86-msi:
    description: Path to the x86 MSI to embed, relative to the bundle project.
    required: true
  arm64-msi:
    description: Path to the arm64 MSI to embed, relative to the bundle project.
    required: true
  version:
    description: Bundle version, e.g. 1.0.0.
    required: true
  output:
    description: Output directory for the built .exe.
    required: true

runs:
  using: composite
  steps:
    - name: Build bundle ${{ inputs.version }}
      shell: pwsh
      # Version-scoped intermediate directory, for the reason spelled out in build-msi: MSBuild's up-to-date
      # check does not track property changes, so a shared obj/ turns a second build into a copy of the first.
      # Inputs reach the script through env, never as ${{ }} expressions inside run (see the publish action:
      # an expression is pasted into the script text, so a crafted version would run as code).
      env:
        BUNDLE_X64_MSI: ${{ inputs.x64-msi }}
        BUNDLE_X86_MSI: ${{ inputs.x86-msi }}
        BUNDLE_ARM64_MSI: ${{ inputs.arm64-msi }}
        BUNDLE_VERSION_INPUT: ${{ inputs.version }}
        BUNDLE_OUTPUT: ${{ inputs.output }}
      run: |
        $arguments = @(
          'build', 'src/JenkinsAsService.Bundle'
          '--nologo'
          '--configuration', 'Release'
          '-p:RestoreLockedMode=true'
          "-p:X64Msi=$env:BUNDLE_X64_MSI"
          "-p:X86Msi=$env:BUNDLE_X86_MSI"
          "-p:Arm64Msi=$env:BUNDLE_ARM64_MSI"
          "-p:Version=$env:BUNDLE_VERSION_INPUT"
          "-p:BaseIntermediateOutputPath=obj/bundle-$env:BUNDLE_VERSION_INPUT/"
          '--output', $env:BUNDLE_OUTPUT
        )
        dotnet @arguments
