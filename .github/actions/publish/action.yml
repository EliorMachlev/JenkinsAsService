name: Publish self-contained executable
description: >-
  Publishes the service as an optimized, self-contained single-file executable. The flag set lived in five
  near-identical copies across build.yml and release.yml; build.yml exists to mirror the release compile and
  package steps, so a flag drifting between them defeated the point of having it. One definition here means
  the binary CI validates is built exactly like the one that ships.

inputs:
  runtime:
    description: RID to publish for - win-x64, win-x86 or win-arm64.
    required: true
  output:
    description: Output directory for the published files.
    required: true
  version:
    description: InformationalVersion stamped into the assembly. Defaults to the project value.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Publish ${{ inputs.runtime }}
      shell: pwsh
      # Inputs reach the script through env, never as ${{ }} expressions inside run: an expression is pasted
      # into the script text before the shell parses it, so a crafted value (release.yml feeds the version
      # from a tag or a workflow_dispatch input) would run as code. As env values they are only ever data,
      # and each is passed to dotnet as one argument.
      env:
        PUBLISH_RUNTIME: ${{ inputs.runtime }}
        PUBLISH_OUTPUT: ${{ inputs.output }}
        PUBLISH_VERSION: ${{ inputs.version }}
      run: |
        $arguments = @(
          'publish', 'src/JenkinsAsService'
          '--nologo'
          '--configuration', 'Release'
          '-p:RestoreLockedMode=true'
          '--runtime', $env:PUBLISH_RUNTIME
          '--self-contained', 'true'
          '--output', $env:PUBLISH_OUTPUT
          '-p:PublishSingleFile=true'
          '-p:EnableCompressionInSingleFile=true'
          '-p:PublishReadyToRun=true'
          '-p:OptimizationPreference=Speed'
          '-p:UseSharedCompilation=true'
          '-p:DebuggerSupport=false'
          '-p:MetadataUpdaterSupport=false'
          '-p:Deterministic=true'
          '-p:DebugType=Embedded'
          '-p:DebugSymbols=true'
        )
        if ($env:PUBLISH_VERSION) {
          $arguments += "-p:InformationalVersion=$env:PUBLISH_VERSION"
        }
        $arguments += '/v:q', '/clp:ErrorsOnly'
        dotnet @arguments
