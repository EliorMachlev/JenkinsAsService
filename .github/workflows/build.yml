name: .NET Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore -p:RestoreLockedMode=true

      - name: Test
        run: dotnet test -c Release --verbosity normal

      - name: Generate SBOM (CycloneDX)
        run: |
          dotnet tool install --global CycloneDX --version 6.2.0
          dotnet-CycloneDX src/JenkinsAsService/JenkinsAsService.csproj --output sbom --output-format Json --filename bom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom/bom.json
          if-no-files-found: error

      - name: Publish x64
        uses: ./.github/actions/publish
        with:
          runtime: win-x64
          output: publish/x64/

      - name: Publish x86
        uses: ./.github/actions/publish
        with:
          runtime: win-x86
          output: publish/x86/

      # Separate BaseIntermediateOutputPath per architecture — see the same note in release.yml. With a shared
      # obj/ the x86 build took 0.80s against x64's 16.77s and simply copied the x64 package.
      - name: Build MSI x64
        run: dotnet build src/JenkinsAsService.Installer -c Release -p:RestoreLockedMode=true -p:PublishDir=../../publish/x64/ -p:InstallerPlatform=x64 -p:Version=0.0.0 -p:BaseIntermediateOutputPath=obj/msi-x64/ -o msi/x64/

      - name: Build MSI x86
        run: dotnet build src/JenkinsAsService.Installer -c Release -p:RestoreLockedMode=true -p:PublishDir=../../publish/x86/ -p:InstallerPlatform=x86 -p:Version=0.0.0 -p:BaseIntermediateOutputPath=obj/msi-x86/ -o msi/x86/

      # build.yml mirrors the release steps, so it mirrors the guard too.
      - name: Verify each MSI targets its own architecture
        shell: pwsh
        run: |
          function Get-MsiPlatform([string]$Path) {
            $installer = New-Object -ComObject WindowsInstaller.Installer
            $summary = $installer.GetType().InvokeMember(
              'SummaryInformation', 'GetProperty', $null, $installer, @($Path, 0))
            return $summary.GetType().InvokeMember('Property', 'GetProperty', $null, $summary, @(7))
          }
          $x64 = Get-MsiPlatform (Get-Item msi/x64/*.msi).FullName
          $x86 = Get-MsiPlatform (Get-Item msi/x86/*.msi).FullName
          Write-Host "x64 package: $x64"
          Write-Host "x86 package: $x86"
          if ($x64 -notlike 'x64*') { throw "The x64 MSI reports platform '$x64'" }
          if ($x86 -notlike 'Intel*') { throw "The x86 MSI reports platform '$x86' (expected Intel = 32-bit)" }

  # Installs the MSI for real. The reconcile logic is unit-tested, but custom-action SEQUENCING under
  # WIX_UPGRADE_DETECTED only happens during an actual in-place upgrade — previously a manual-verify step,
  # which is why the upgrade path stayed on the "not verified" list release after release.
  msi-lifecycle:
    name: MSI Install / Upgrade / Uninstall
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Same flags as the shipped artifact: this job installs and runs the binary, so it must exercise the
      # one users actually get, not a cheaper approximation of it.
      - name: Publish x64
        uses: ./.github/actions/publish
        with:
          runtime: win-x64
          output: publish/x64/

      # Two versions from one publish: the upgrade needs a higher ProductVersion, nothing else differs.
      #
      # BaseIntermediateOutputPath must differ per version. Version reaches the .wxs through DefineConstants,
      # which is an MSBuild PROPERTY, not a tracked file input — so with a shared obj/ the second build sees an
      # up-to-date project, skips the compile in ~1s and just copies the FIRST MSI to the new -o directory.
      # Both packages then carry ProductVersion 1.0.0 and the same ProductCode, and the "upgrade" degrades into
      # a maintenance-mode reconfigure of the already-installed product: RemoveExistingProducts is skipped and
      # the reconcile custom actions never run. Separate intermediate directories force two real builds.
      - name: Build MSI 1.0.0 and 1.0.1
        run: |
          dotnet build src/JenkinsAsService.Installer -c Release -p:RestoreLockedMode=true -p:PublishDir=../../publish/x64/ -p:InstallerPlatform=x64 -p:Version=1.0.0 -p:BaseIntermediateOutputPath=obj/msi-v1/ -o msi/v1/
          dotnet build src/JenkinsAsService.Installer -c Release -p:RestoreLockedMode=true -p:PublishDir=../../publish/x64/ -p:InstallerPlatform=x64 -p:Version=1.0.1 -p:BaseIntermediateOutputPath=obj/msi-v2/ -o msi/v2/

      - name: Install, upgrade, uninstall
        shell: pwsh
        run: .github/scripts/Test-MsiLifecycle.ps1 -V1Msi (Get-Item msi/v1/*.msi).FullName -V2Msi (Get-Item msi/v2/*.msi).FullName

      - name: Upload MSI logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msi-logs
          path: msi-logs/
          if-no-files-found: warn
