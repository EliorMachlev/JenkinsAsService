name: .NET Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore -p:RestoreLockedMode=true

      - name: Test
        run: dotnet test -c Release --verbosity normal

      - name: Generate SBOM (CycloneDX)
        run: |
          dotnet tool install --global CycloneDX --version 6.2.0
          dotnet-CycloneDX src/JenkinsAsService/JenkinsAsService.csproj --output sbom --output-format Json --filename bom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom/bom.json
          if-no-files-found: error

      - name: Publish x64
        run: >-
          dotnet publish src/JenkinsAsService
          --nologo
          --configuration Release
          -p:RestoreLockedMode=true
          --runtime win-x64
          --self-contained true
          --output publish/x64/
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:OptimizationPreference=Speed
          -p:UseSharedCompilation=true
          -p:DebuggerSupport=false
          -p:MetadataUpdaterSupport=false
          -p:Deterministic=true
          -p:DebugType=Embedded
          -p:DebugSymbols=true
          /v:q /clp:ErrorsOnly

      - name: Publish x86
        run: >-
          dotnet publish src/JenkinsAsService
          --nologo
          --configuration Release
          -p:RestoreLockedMode=true
          --runtime win-x86
          --self-contained true
          --output publish/x86/
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:OptimizationPreference=Speed
          -p:UseSharedCompilation=true
          -p:DebuggerSupport=false
          -p:MetadataUpdaterSupport=false
          -p:Deterministic=true
          -p:DebugType=Embedded
          -p:DebugSymbols=true
          /v:q /clp:ErrorsOnly

      - name: Build MSI x64
        run: dotnet build src/JenkinsAsService.Installer -c Release -p:RestoreLockedMode=true -p:PublishDir=../../publish/x64/ -p:InstallerPlatform=x64 -p:Version=0.0.0 -o msi/x64/

      - name: Build MSI x86
        run: dotnet build src/JenkinsAsService.Installer -c Release -p:RestoreLockedMode=true -p:PublishDir=../../publish/x86/ -p:InstallerPlatform=x86 -p:Version=0.0.0 -o msi/x86/
