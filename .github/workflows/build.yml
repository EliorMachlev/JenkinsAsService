name: .NET Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore -p:RestoreLockedMode=true

      - name: Test
        run: dotnet test -c Release --verbosity normal

      - name: Publish x64
        run: >-
          dotnet publish src/JenkinsAsService
          --nologo
          --configuration Release
          -p:RestoreLockedMode=true
          --runtime win-x64
          --self-contained true
          --output publish/x64/
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:OptimizationPreference=Speed
          -p:UseSharedCompilation=true
          -p:DebuggerSupport=false
          -p:MetadataUpdaterSupport=false
          -p:Deterministic=true
          -p:DebugType=Embedded
          -p:DebugSymbols=true
          /v:q /clp:ErrorsOnly

      - name: Publish x86
        run: >-
          dotnet publish src/JenkinsAsService
          --nologo
          --configuration Release
          -p:RestoreLockedMode=true
          --runtime win-x86
          --self-contained true
          --output publish/x86/
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -p:OptimizationPreference=Speed
          -p:UseSharedCompilation=true
          -p:DebuggerSupport=false
          -p:MetadataUpdaterSupport=false
          -p:Deterministic=true
          -p:DebugType=Embedded
          -p:DebugSymbols=true
          /v:q /clp:ErrorsOnly

      - name: Build MSI x64
        run: dotnet build src/JenkinsAsService.Installer -c Release -p:RestoreLockedMode=true -p:PublishDir=../../publish/x64/ -p:InstallerPlatform=x64 -p:Version=0.0.0 -o msi/x64/

      - name: Build MSI x86
        run: dotnet build src/JenkinsAsService.Installer -c Release -p:RestoreLockedMode=true -p:PublishDir=../../publish/x86/ -p:InstallerPlatform=x86 -p:Version=0.0.0 -o msi/x86/
