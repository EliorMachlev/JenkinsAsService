name: PSScriptAnalyzer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '23 23 * * 0'
  workflow_dispatch:

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The scan logic lives in the script, not here: it is the one piece of PowerShell in the repository
      # that this job could not analyze while it was an inline run: block, and it could not be run locally
      # without hand-copying YAML out of a block scalar.
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: .github/scripts/Invoke-ScriptAnalyzerScan.ps1 -Root ($env:GITHUB_WORKSPACE ?? $PWD.Path) -SarifPath results.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: results.sarif
          category: psscriptanalyzer
