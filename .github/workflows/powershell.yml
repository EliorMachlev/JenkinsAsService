name: PSScriptAnalyzer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '23 23 * * 0'
  workflow_dispatch:

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $root    = $env:GITHUB_WORKSPACE ?? $PWD.Path
          $results = Invoke-ScriptAnalyzer -Path $root -Recurse

          $sarifResults = @($results | ForEach-Object {
            $rel = $_.ScriptPath.Replace($root, '').TrimStart('/\').Replace('\', '/')
            @{
              ruleId    = $_.RuleName
              level     = switch ($_.Severity) { 'Error' { 'error' } 'Warning' { 'warning' } default { 'note' } }
              message   = @{ text = $_.Message }
              locations = @(@{
                physicalLocation = @{
                  artifactLocation = @{ uri = $rel; uriBaseId = '%SRCROOT%' }
                  region           = @{ startLine = [int]$_.Line; startColumn = [int]$_.Column }
                }
              })
            }
          })

          @{
            '$schema' = 'https://json.schemastore.org/sarif-2.1.0.json'
            version   = '2.1.0'
            runs      = @(@{
              tool    = @{ driver = @{ name = 'PSScriptAnalyzer'; rules = @() } }
              results = $sarifResults
            })
          } | ConvertTo-Json -Depth 20 | Set-Content results.sarif -Encoding utf8

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: results.sarif
          category: psscriptanalyzer
