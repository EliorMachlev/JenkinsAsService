name: PSScriptAnalyzer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '23 23 * * 0'
  workflow_dispatch:

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          # PSScriptAnalyzer is pre-installed on ubuntu-latest runners.
          # ConvertToSARIF translates its output objects to the SARIF format
          # required by GitHub Code Scanning.
          Install-Module -Name ConvertToSARIF -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path .\ -Recurse | ConvertTo-SARIF -FilePath results.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: results.sarif
          category: psscriptanalyzer
