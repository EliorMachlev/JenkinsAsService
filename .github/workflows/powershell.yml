name: PSScriptAnalyzer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '23 23 * * 0'
  workflow_dispatch:

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE ?? $PWD.Path

          # Explicit file list rather than `-Path $root -Recurse`, and a bounded retry.
          #
          # Recursing a tree makes PSScriptAnalyzer walk directories and probe for modules, and that path
          # throws an intermittent "Object reference not set to an instance of an object" - reproduced here
          # as 1 crash in 3 runs over an UNCHANGED tree, on 1.22.0 and 1.25.0 alike. It is a flake in the
          # analyzer, not a finding: the same files analyzed individually are always clean. Passing paths
          # directly skips the traversal that trips it.
          #
          # The retry covers the residue. Findings never fail this job (they are uploaded as SARIF below),
          # so the only way it can fail is the analyzer itself throwing - which must still fail loudly after
          # a few attempts rather than be swallowed into a green check.
          $files = @(Get-ChildItem -Path $root -Include *.ps1, *.psm1, *.psd1 -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/](obj|bin|node_modules|\.git)[\\/]' } |
            Select-Object -ExpandProperty FullName)
          Write-Host "Analyzing $($files.Count) PowerShell file(s)."
          if ($files.Count -eq 0) { throw 'No PowerShell files found - the file filter is wrong.' }

          # -Path takes one path, so this is a loop rather than an array argument - which also scopes each
          # retry to the single file that flaked instead of redoing the whole set.
          $results = @(foreach ($file in $files) {
            foreach ($attempt in 1..3) {
              try {
                Invoke-ScriptAnalyzer -Path $file -ErrorAction Stop
                break
              }
              catch {
                Write-Host "::warning::PSScriptAnalyzer attempt $attempt on $file failed: $($_.Exception.Message)"
                if ($attempt -eq 3) { throw }
              }
            }
          })
          Write-Host "$($results.Count) finding(s)."

          $sarifResults = @($results | ForEach-Object {
            $rel = $_.ScriptPath.Replace($root, '').TrimStart('/\').Replace('\', '/')
            @{
              ruleId    = $_.RuleName
              level     = switch ($_.Severity) { 'Error' { 'error' } 'Warning' { 'warning' } default { 'note' } }
              message   = @{ text = $_.Message }
              locations = @(@{
                physicalLocation = @{
                  artifactLocation = @{ uri = $rel; uriBaseId = '%SRCROOT%' }
                  region           = @{ startLine = [int]$_.Line; startColumn = [int]$_.Column }
                }
              })
            }
          })

          @{
            '$schema' = 'https://json.schemastore.org/sarif-2.1.0.json'
            version   = '2.1.0'
            runs      = @(@{
              tool    = @{ driver = @{ name = 'PSScriptAnalyzer'; rules = @() } }
              results = $sarifResults
            })
          } | ConvertTo-Json -Depth 20 | Set-Content results.sarif -Encoding utf8

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: results.sarif
          category: psscriptanalyzer
