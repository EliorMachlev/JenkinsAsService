name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional explicit version (e.g. 1.05). Leave blank to auto-bump the latest published non-prerelease release by +1.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore -p:RestoreLockedMode=true

      - name: Test
        run: dotnet test -c Release --verbosity normal

      - name: Set version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:EVENT_NAME -eq 'push') {
            # Triggered by a pushed tag (e.g. v1.0.5 or 1.04) — use it verbatim.
            $version = $env:REF_NAME.TrimStart('v')
            $tag = $env:REF_NAME
          }
          elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_VERSION)) {
            # Manual run with an explicit version override.
            $version = $env:INPUT_VERSION.TrimStart('v')
            $tag = $version
          }
          else {
            # Manual run, no version given — bump the latest published non-prerelease release by +1.
            $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name'
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($latest)) {
              throw "Could not determine the latest published release. Provide an explicit 'version' input."
            }
            $parts = $latest.TrimStart('v').Split('.')
            $last = $parts[-1]
            if ($last -notmatch '^\d+$') {
              throw "Latest release tag '$latest' does not end in a numeric segment; provide an explicit 'version' input."
            }
            # Increment the final segment, preserving zero-padding width (e.g. 1.03 -> 1.04).
            $parts[-1] = ([int]$last + 1).ToString().PadLeft($last.Length, '0')
            $version = $parts -join '.'
            $tag = $version
            Write-Host "Auto-bumped latest release '$latest' -> '$version'"
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish x64
        uses: ./.github/actions/publish
        with:
          runtime: win-x64
          output: publish/x64/
          version: ${{ steps.version.outputs.VERSION }}

      - name: Publish x86
        uses: ./.github/actions/publish
        with:
          runtime: win-x86
          output: publish/x86/
          version: ${{ steps.version.outputs.VERSION }}

      - name: Build MSI x64
        uses: ./.github/actions/build-msi
        with:
          publish-dir: ../../publish/x64/
          platform: x64
          version: ${{ steps.version.outputs.VERSION }}
          output: msi/x64/

      - name: Build MSI x86
        uses: ./.github/actions/build-msi
        with:
          publish-dir: ../../publish/x86/
          platform: x86
          version: ${{ steps.version.outputs.VERSION }}
          output: msi/x86/

      # Every release to date shipped an x86 package that was really the x64 one, because nothing ever
      # checked. Verified before the packages are renamed and published.
      - name: Verify each MSI targets its own architecture
        shell: pwsh
        run: .github/scripts/Test-MsiPlatform.ps1 -X64Msi (Get-Item msi/x64/*.msi).FullName -X86Msi (Get-Item msi/x86/*.msi).FullName

      - name: Rename MSI files
        run: |
          $v = "${{ steps.version.outputs.VERSION }}"
          Move-Item msi/x64/JenkinsAsService.Installer.msi "JenkinsAsService_${v}_x64.msi"
          Move-Item msi/x86/JenkinsAsService.Installer.msi "JenkinsAsService_${v}_x86.msi"

      - name: Generate SBOM (CycloneDX)
        run: |
          $v = "${{ steps.version.outputs.VERSION }}"
          dotnet tool install --global CycloneDX --version 6.2.0
          dotnet-CycloneDX src/JenkinsAsService/JenkinsAsService.csproj --output . --output-format Json --filename "JenkinsAsService_${v}_sbom.json" --set-version $v

      - name: Create 7z archives
        run: |
          7z a -t7z -mx=9 "JenkinsAsService_${{ steps.version.outputs.VERSION }}_x64.7z" ./publish/x64/JenkinsAsService.exe ./publish/x64/appsettings.json
          7z a -t7z -mx=9 "JenkinsAsService_${{ steps.version.outputs.VERSION }}_x86.7z" ./publish/x86/JenkinsAsService.exe ./publish/x86/appsettings.json

      - name: Install WinRAR
        run: choco install winrar -y --no-progress

      - name: Create RAR5 archives with recovery record
        run: |
          $rar = "C:\Program Files\WinRAR\rar.exe"
          & $rar a -ma5 -rr5p -ep1 "JenkinsAsService_${{ steps.version.outputs.VERSION }}_x64.rar" ./publish/x64/JenkinsAsService.exe ./publish/x64/appsettings.json
          & $rar a -ma5 -rr5p -ep1 "JenkinsAsService_${{ steps.version.outputs.VERSION }}_x86.rar" ./publish/x86/JenkinsAsService.exe ./publish/x86/appsettings.json

      - name: Generate checksums
        run: |
          $v = "${{ steps.version.outputs.VERSION }}"
          $files = [ordered]@{
            "JenkinsAsService_${v}_x64.msi"  = "JenkinsAsService_${v}_x64.msi"
            "JenkinsAsService_${v}_x86.msi"  = "JenkinsAsService_${v}_x86.msi"
            "JenkinsAsService_${v}_x64.7z"   = "JenkinsAsService_${v}_x64.7z"
            "JenkinsAsService_${v}_x64.rar"  = "JenkinsAsService_${v}_x64.rar"
            "JenkinsAsService_${v}_x86.7z"   = "JenkinsAsService_${v}_x86.7z"
            "JenkinsAsService_${v}_x86.rar"  = "JenkinsAsService_${v}_x86.rar"
            "x64/JenkinsAsService.exe"       = "publish/x64/JenkinsAsService.exe"
            "x64/appsettings.json"           = "publish/x64/appsettings.json"
            "x86/JenkinsAsService.exe"       = "publish/x86/JenkinsAsService.exe"
            "x86/appsettings.json"           = "publish/x86/appsettings.json"
            "JenkinsAsService_${v}_sbom.json" = "JenkinsAsService_${v}_sbom.json"
          }
          $checksums = [ordered]@{ version = $v; algorithm = "SHA256"; files = [ordered]@{} }
          foreach ($entry in $files.GetEnumerator()) {
            $hash = (Get-FileHash -Algorithm SHA256 $entry.Value).Hash.ToLower()
            $checksums.files[$entry.Key] = $hash
          }
          $checksums | ConvertTo-Json -Depth 3 | Set-Content "JenkinsAsService_${v}_checksums.json" -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          generate_release_notes: true
          files: |
            JenkinsAsService_${{ steps.version.outputs.VERSION }}_x64.msi
            JenkinsAsService_${{ steps.version.outputs.VERSION }}_x86.msi
            JenkinsAsService_${{ steps.version.outputs.VERSION }}_x64.7z
            JenkinsAsService_${{ steps.version.outputs.VERSION }}_x64.rar
            JenkinsAsService_${{ steps.version.outputs.VERSION }}_x86.7z
            JenkinsAsService_${{ steps.version.outputs.VERSION }}_x86.rar
            JenkinsAsService_${{ steps.version.outputs.VERSION }}_sbom.json
            JenkinsAsService_${{ steps.version.outputs.VERSION }}_checksums.json
