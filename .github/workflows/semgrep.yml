name: Semgrep

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '38 4 * * 0'
  workflow_dispatch:

# A newer push to the same PR supersedes a run still going; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # A PR's results go on its head commit, not GitHub's test merge with main, which GitHub can rebuild after
  # the run starts - the alerts would then belong to a commit the PR no longer shows. Empty off a PR, where
  # the upload action falls back to the pushed ref and commit.
  SARIF_REF: ${{ github.event.pull_request && format('refs/pull/{0}/head', github.event.pull_request.number) || '' }}
  SARIF_SHA: ${{ github.event.pull_request.head.sha || '' }}

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Semgrep and every package it needs, each pinned by hash (.github/semgrep/requirements.txt, compiled
      # from requirements.in on this Python version), so Dependabot's pip updater keeps it current. This
      # replaced the semgrep/semgrep container digest, which no Dependabot ecosystem tracks and had to be
      # bumped by hand. (Before that, the archived semgrep/semgrep-action had silently stopped scanning:
      # its bundled engine could not parse the registry rules and exited 0.)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install Semgrep
        run: python -m pip install --quiet --require-hashes -r .github/semgrep/requirements.txt

      # Every finding is printed here and uploaded to code scanning below, and any blocking finding fails
      # the job (--error). No rule is excluded and no path is left out.
      # Exit 0 = clean, 1 = findings (--error); anything else means Semgrep itself failed. The code is kept
      # so the upload below can tell the two apart: a failed scan can write a SARIF with no results, and
      # uploading that would mark every existing alert as fixed.
      - name: Run Semgrep
        id: scan
        run: |
          code=0
          semgrep scan \
            --config=p/default \
            --config=p/csharp \
            --config=p/secrets \
            --config=p/github-actions \
            --error \
            --sarif-output=semgrep.sarif || code=$?
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload SARIF to code scanning
        if: always() && (steps.scan.outputs.exit-code == '0' || steps.scan.outputs.exit-code == '1')
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
          ref: ${{ env.SARIF_REF }}
          sha: ${{ env.SARIF_SHA }}
