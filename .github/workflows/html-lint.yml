name: HTML & CSS Lint

on:
  push:
    branches: [ "main" ]
    paths: [ "docs/**", ".github/workflows/html-lint.yml", ".github/scripts/check_doc_links.py" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "docs/**", ".github/workflows/html-lint.yml", ".github/scripts/check_doc_links.py" ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate HTML (W3C Nu Checker)
        run: |
          pip install html5validator --quiet
          html5validator --root docs/ --match "*.html" --log INFO

      - name: Lint CSS (Stylelint)
        run: |
          npm install --no-save stylelint stylelint-config-standard --silent
          npx stylelint "docs/*.css"

      # Nu validates markup and Stylelint validates CSS; neither notices a link pointing at a section that
      # no longer exists. Uses only the standard library, so there is nothing to install and no new action pin.
      - name: Check internal links and search index
        run: python .github/scripts/check_doc_links.py
