name: HTML Lint

on:
  push:
    branches: [ "main" ]
    paths: [ "docs/**" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "docs/**" ]

permissions:
  contents: read

jobs:
  htmlhint:
    name: HTMLHint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Run HTMLHint
        run: npx --yes htmlhint "docs/**/*.html"
